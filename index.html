<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FlashFood - Real Auth</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f0fdf4}header{background:#0f172a;color:white;padding:14px 18px;display:flex;justify-content:space-between} .logo{font-weight:900;font-size:22px}.logo span{color:#22c55e} .container{max-width:900px;margin:auto;padding:14px} .card{background:white;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.07)} input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0 10px} button{padding:12px;border:none;border-radius:10px;font-weight:700;color:white;width:100%;margin-top:6px;background:#0f172a} button.green{background:#22c55e}button.blue{background:#0ea5e9} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}} .meal{border:2px solid #e2e8f0;border-radius:14px;padding:12px} .price{color:#22c55e;font-weight:900} .icons{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap} .icons a{padding:8px 12px;border-radius:8px;font-weight:700;color:white;text-decoration:none;font-size:13px} .wa{background:#25D366} .mail{background:#EA4335} .video{background:#0ea5e9} .small{font-size:12px;color:#64748b} .hidden{display:none} .track{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:8px 0} .track div{height:100%;background:#22c55e;width:0%;transition:2s} .otp-box{background:#fef9c3;border:2px dashed #facc15;padding:10px;border-radius:10px;margin-top:8px} .auth-box{max-width:420px;margin:40px auto}</style></head>
<body>
<header><div class="logo">Flash<span>Food</span> Real</div><div id="user-info" class="small"></div></header>
<div class="container">

<!-- AUTH SCREEN - MUST LOGIN FIRST -->
<div id="auth-screen" class="card auth-box">
<h2 style="text-align:center">🔐 Login to FlashFood</h2>
<p class="small" style="text-align:center">Buyer or Hotel must login with Gmail & Phone</p>
<select id="auth-role" style="width:100%;padding:12px;border-radius:10px;margin-bottom:8px"><option value="buyer">I am Buyer</option><option value="company">I am Hotel / Company</option></select>
<input id="auth-email" type="email" placeholder="Gmail e.g chijioke@gmail.com">
<input id="auth-phone" placeholder="Phone Number e.g 08031234567">
<input id="auth-name" placeholder="Full Name">
<input id="auth-password" type="password" placeholder="Create Password">
<button class="green" onclick="signup()">Create Account & Login</button>
<button class="outline" style="background:white;color:#0f172a;border:2px solid #0f172a" onclick="login()">Already have account? Login</button>
<p id="auth-status" class="small"></p>
</div>

<!-- APP AFTER LOGIN -->
<div id="app" class="hidden">
<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b id="welcome"></b><div class="small" id="welcome-phone"></div></div><button style="width:auto;padding:8px 12px;background:#ef4444" onclick="logout()">Logout</button></div>

<!-- BUYER VIEW -->
<div id="buyer-view" class="hidden"><div class="card" style="background:#22c55e;color:white;text-align:center"><h3>Buyer Dashboard</h3></div><div id="buyer-meals" class="grid"></div></div>

<!-- COMPANY VIEW -->
<div id="company-view" class="hidden">
<div class="card"><h3>Company Dashboard</h3><input id="c_account" placeholder="Account No for buyers to pay"><input id="c_whatsapp" placeholder="WhatsApp Business No 234..."><input id="c_video" placeholder="Google Meet Link"><button class="blue" onclick="saveCompanyInfo()">Save My Contact Info</button><p id="c_save_status" class="small"></p></div>
<div class="card"><h3>Post Meal</h3><input id="m_name" placeholder="Food Name"><input id="m_price" type="number" placeholder="Price"><input id="m_qty" type="number" placeholder="Qty"><input id="m_location" placeholder="Location"><input id="m_expiry" placeholder="Pickup Time"><button class="green" onclick="postMeal()">Post with Real Contact</button><p id="postStatus" class="small"></p></div>
<div class="card"><h3>Verify Payment & Send OTP</h3><div class="small">When buyer pays, send them OTP via WhatsApp</div><input id="otp_meal_short" placeholder="Meal Short ID e.g a1b2c3d4"><input id="otp_code" placeholder="OTP e.g 1234"><button class="blue" onclick="sendOTP()">Send OTP to Buyer</button><p id="otpStatus" class="small"></p><div id="company-meals"></div></div>
</div>
</div>
</div>

<script>
const URL="https://xjiutjktiyketsoez.supabase.co"; const KEY="sb_publishable_AQtHqJMmFimeQR4PWTu5PA_lKbJrDEu"; const sb=window.supabase.createClient(URL,KEY);
let currentUser=null;

async function signup(){
 const email=document.getElementById('auth-email').value.trim(); const phone=document.getElementById('auth-phone').value.trim(); const name=document.getElementById('auth-name').value.trim(); const pass=document.getElementById('auth-password').value; const role=document.getElementById('auth-role').value;
 if(!email.includes('@')||!phone||!pass){document.getElementById('auth-status').textContent='Fill Gmail, Phone, Password';return}
 document.getElementById('auth-status').textContent='Creating account...';
 const {data,error}=await sb.auth.signUp({email:email,password:pass}); 
 if(error && !error.message.includes('already')){document.getElementById('auth-status').textContent=error.message;return}
 await sb.from('profiles').upsert({email:email,role:role,phone:phone,name:name});
 currentUser={email,phone,name,role}; localStorage.setItem('ff_user',JSON.stringify(currentUser));
 afterLogin();
}
async function login(){
 const email=document.getElementById('auth-email').value.trim(); const pass=document.getElementById('auth-password').value;
 document.getElementById('auth-status').textContent='Logging in...';
 const {data,error}=await sb.auth.signInWithPassword({email:email,password:pass});
 if(error){document.getElementById('auth-status').textContent=error.message+' — Try signup first';return}
 const {data:prof}=await sb.from('profiles').select('*').eq('email',email).single();
 currentUser=prof||{email:email,role:document.getElementById('auth-role').value,phone:'',name:email};
 localStorage.setItem('ff_user',JSON.stringify(currentUser)); afterLogin();
}
function afterLogin(){
 const saved=JSON.parse(localStorage.getItem('ff_user')||'null'); if(saved) currentUser=saved;
 if(!currentUser) return;
 document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
 document.getElementById('welcome').textContent=`Welcome ${currentUser.name||currentUser.email} (${currentUser.role})`;
 document.getElementById('welcome-phone').textContent=`📱 ${currentUser.phone} • ✉️ ${currentUser.email}`;
 document.getElementById('user-info').textContent=currentUser.email;
 if(currentUser.role==='buyer'){document.getElementById('buyer-view').classList.remove('hidden');document.getElementById('company-view').classList.add('hidden');loadMeals();}
 else {document.getElementById('buyer-view').classList.add('hidden');document.getElementById('company-view').classList.remove('hidden');loadCompanyMeals();}
}
function logout(){localStorage.removeItem('ff_user'); sb.auth.signOut(); location.reload();}
function saveCompanyInfo(){currentUser.account=document.getElementById('c_account').value; currentUser.whatsapp=document.getElementById('c_whatsapp').value.replace(/[^0-9]/g,''); currentUser.video=document.getElementById('c_video').value; localStorage.setItem('ff_user',JSON.stringify(currentUser)); document.getElementById('c_save_status').textContent='✅ Saved! Now when you post meal, buyers will chat you on real WhatsApp';}
async function postMeal(){const data={restaurant_email:currentUser.email,name:document.getElementById('m_name').value,price:parseInt(document.getElementById('m_price').value),qty:parseInt(document.getElementById('m_qty').value),location:document.getElementById('m_location').value,expiry:document.getElementById('m_expiry').value,whatsapp:currentUser.whatsapp,account_no:currentUser.account,video_link:currentUser.video,is_available:true}; const {error}=await sb.from('meals').insert([data]); document.getElementById('postStatus').textContent=error?error.message:'✅ Posted! Buyer will see your real WhatsApp'; loadMeals(); loadCompanyMeals();}
async function loadMeals(){const c=document.getElementById('buyer-meals'); if(!c) return; c.innerHTML='Loading...'; const {data}=await sb.from('meals').select('*').order('created_at',{ascending:false}); if(!data||!data.length){c.innerHTML='No meals';return} c.innerHTML=''; data.forEach(m=>{const div=document.createElement('div');div.className='meal'; div.innerHTML=`<b>${m.name}</b><div class="price">₦${m.price}</div><div class="small">${m.location} • Hotel: ${m.restaurant_email}<br>Account: ${m.account_no||''}</div><div class="icons"><a class="mail" href="mailto:${m.restaurant_email}?subject=FlashFood Order ${m.name}">✉️ Email</a><a class="wa" href="https://wa.me/${m.whatsapp||''}?text=Hello, I saw ${m.name} on FlashFood" target="_blank">💬 WhatsApp</a><a class="video" href="${m.video_link||'https://meet.google.com'}" target="_blank">📹 Video</a></div><button class="blue" onclick="paid('${m.id}')">I have made transfer</button><div id="otp-area-${m.id}" class="hidden otp-box"><input id="otp-input-${m.id}" placeholder="Enter OTP hotel sent"><button class="green" onclick="checkOTP('${m.id}')">Verify OTP</button><div id="track-${m.id}" class="hidden"><p><b>✅ Tracking</b></p><div class="track"><div id="bar-${m.id}"></div></div><p class="small" id="txt-${m.id}">Preparing</p></div></div>`;c.appendChild(div);});}
function paid(id){document.getElementById(`otp-area-${id}`).classList.remove('hidden'); alert('Marked as paid. Wait for hotel OTP via WhatsApp.');}
function checkOTP(id){const e=document.getElementById(`otp-input-${id}`).value; const real=localStorage.getItem('ff_otp_'+id)||localStorage.getItem('ff_last_otp')||'1234'; if(e===real||e==='1234'){const t=document.getElementById(`track-${id}`);t.classList.remove('hidden'); const b=document.getElementById(`bar-${id}`); const x=document.getElementById(`txt-${id}`); b.style.width='30%'; x.textContent='Picked up'; setTimeout(()=>{b.style.width='70%';x.textContent='On the way';},2000); setTimeout(()=>{b.style.width='100%';x.textContent='Delivered!';},4000);} else alert('Wrong OTP. Use 1234 for demo.');}
async function loadCompanyMeals(){const c=document.getElementById('company-meals'); if(!c) return; const {data}=await sb.from('meals').select('*').eq('restaurant_email',currentUser.email); c.innerHTML=data?data.map(m=>`<div class="small">${m.name} — ID: ${m.id.substring(0,8)} — ₦${m.price}</div>`).join(''):'';}
async function sendOTP(){const short=document.getElementById('otp_meal_short').value.trim(); const code=document.getElementById('otp_code').value||'1234'; const {data}=await sb.from('meals').select('id'); const full=data?.find(m=>m.id.startsWith(short))?.id||short; localStorage.setItem('ff_otp_'+full,code); localStorage.setItem('ff_last_otp',code); document.getElementById('otpStatus').textContent=`✅ OTP ${code} for ${full} — Now send via WhatsApp to buyer: "Your FlashFood OTP is ${code}"`;}
(function init(){const saved=JSON.parse(localStorage.getItem('ff_user')||'null'); if(saved){currentUser=saved; afterLogin();}})();
</script></body></html>
