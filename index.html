<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashfood PH</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f8fafc;margin:0;padding:20px}
.card{max-width:480px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{margin:0 0 8px;text-align:center} .sub{text-align:center;color:#64748b;margin-bottom:20px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px} .tab{flex:1;padding:10px;border-radius:10px;border:1px solid #e2e8f0;background:#f1f5f9;cursor:pointer;font-weight:600}
.tab.active{background:#16a34a;color:#fff;border-color:#16a34a}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #e2e8f0;margin:6px 0 12px;font-size:15px}
button.btn{width:100%;padding:13px;border-radius:12px;border:0;background:#16a34a;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button.btn:disabled{opacity:.6} .msg{padding:12px;border-radius:10px;margin-top:12px;display:none;font-size:14px}
.msg.ok{background:#dcfce7;color:#166534;display:block} .msg.err{background:#fee2e2;color:#991b1b;display:block}
.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<h1>🍔 Flashfood PH</h1>
<div class="sub">Port Harcourt • Sell surplus food fast</div>

<div class="tabs">
<button id="tabLogin" class="tab active" onclick="switchTab('login')">Login</button>
<button id="tabSignup" class="tab" onclick="switchTab('signup')">Signup</button>
</div>

<!-- LOGIN -->
<div id="loginForm">
<input id="loginEmail" type="email" placeholder="Email (e.g chijiokekingsley.us@gmail.com)">
<input id="loginPass" type="password" placeholder="Password">
<button id="btnLogin" class="btn" onclick="doLogin()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signupForm" style="display:none">
<select id="role"><option value="seller">Seller - I sell food</option><option value="buyer">Buyer - I buy food</option></select>
<input id="name" type="text" placeholder="Full Name - Chijioke Kingsley Chiziterem" value="Chijioke Kingsley Chiziterem">
<input id="email" type="email" placeholder="Email - chijiokekingsley.us@gmail.com">
<input id="phone" type="tel" placeholder="Phone - 09161071776" value="09161071776">
<input id="bank" type="text" placeholder="Bank Name - Opay" value="Opay">
<input id="acct" type="text" placeholder="Account Number">
<input id="acctName" type="text" placeholder="Account Name - Chijioke Kingsley Chiziterem" value="Chijioke Kingsley Chiziterem">
<input id="password" type="password" placeholder="Create Password (min 6 chars)">
<button id="btnSignup" class="btn" onclick="doSignup()">Create Account</button>
</div>

<div id="msg" class="msg"></div>
<div class="footer">Powered by Netlify • Supabase: xjiutfikytjkyetsoezn</div>
</div>

<script>
const SUPABASE_URL = 'https://xjiutfikytjkyetsoezn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AQtHqJMmFimeQR4PWTu5PA_lKbJrDEu';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showMsg(t, type){
  const m=document.getElementById('msg');
  m.textContent=t;
  m.className='msg '+(type==='err'?'err':'ok');
  m.style.display='block';
}
function switchTab(t){
  document.getElementById('loginForm').style.display = t==='login'?'block':'none';
  document.getElementById('signupForm').style.display = t==='signup'?'block':'none';
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabSignup').classList.toggle('active', t==='signup');
}
async function doSignup(){
  const btn=document.getElementById('btnSignup');
  btn.disabled=true; btn.textContent='Creating...';
  try{
    const role=document.getElementById('role').value;
    const name=document.getElementById('name').value.trim();
    const email=document.getElementById('email').value.trim();
    const phone=document.getElementById('phone').value.trim();
    const bank=document.getElementById('bank').value.trim();
    const acct=document.getElementById('acct').value.trim();
    const acctName=document.getElementById('acctName').value.trim();
    const password=document.getElementById('password').value;
    if(!email || !password) throw new Error('Email and password required');
    const { data, error } = await supabaseClient.auth.signUp({
      email,password,options:{data:{full_name:name,phone,bank_name:bank,account_number:acct,account_name:acctName,role}}
    });
    if(error) throw error;
    showMsg('✅ Account created! Now click Login tab and login', 'ok');
    setTimeout(()=>{switchTab('login'); document.getElementById('loginEmail').value=email;},1200);
  }catch(e){ showMsg('Signup failed: '+(e.message||e), 'err'); }
  finally{ btn.disabled=false; btn.textContent='Create Account'; }
}
async function doLogin(){
  const btn=document.getElementById('btnLogin');
  btn.disabled=true; btn.textContent='Logging in...';
  try{
    const email=document.getElementById('loginEmail').value.trim();
    const password=document.getElementById('loginPass').value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({email,password});
    if(error) throw error;
    showMsg('✅ Login success! Welcome '+email, 'ok');
  }catch(e){ showMsg('Login failed: '+(e.message||e), 'err'); }
  finally{ btn.disabled=false; btn.textContent='Login'; }
}
</script>
</body>
</html>
