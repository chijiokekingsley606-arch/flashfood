<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashFood Secure Portal</title>
  <style>
    :root { --bg-auth: #0f172a; --panel-auth: #1e293b; --accent: #f97316; --success: #16a34a; --text: #f8fafc; --text-muted: #64748b; }
    body { background: var(--bg-auth); color: var(--text); font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 15px; margin: 0; box-sizing: border-box; transition: background 0.3s; }
    .screen { display: none; text-align: left; max-width: 420px; margin: 0 auto; padding-bottom: 40px; }
    .active-view { display: block; }
    .login-container { background: var(--panel-auth); border: 1px solid #334155; padding: 25px; border-radius: 16px; margin-top: 40px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    .form-group { margin-bottom: 15px; }
    label { font-size: 11px; font-weight: bold; color: var(--text-muted); display: block; margin-bottom: 5px; letter-spacing: 0.5px; }
    select, input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 12px; font-weight: 700; font-size: 14px; border-radius: 10px; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:disabled { background: #334155 !important; color: #64748b !important; cursor: not-allowed; }
    .clear-btn { display: block; margin: 25px auto 0 auto; background: transparent; border: none; color: #ef4444; font-size: 12px; text-decoration: underline; cursor: pointer; }
    
    /* ====== THEME A: BUYER (EMERALD) ====== */
    .theme-buyer { background: #022c22 !important; }
    .buyer-panel { background: #064e3b; border: 1px solid #0f766e; border-radius: 14px; padding: 14px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .card-buyer { background: #064e3b; border: 1px solid #115e59; padding: 16px; border-radius: 14px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .comm-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-whatsapp { background: #25d366; color: #fff; padding: 10px; font-size: 12px; font-weight: bold; border-radius: 6px; border: none; flex: 1; cursor: pointer; text-align: center; text-decoration: none; }
    .btn-call { background: #3b82f6; color: #fff; padding: 10px; font-size: 12px; font-weight: bold; border-radius: 6px; border: none; flex: 1; cursor: pointer; text-align: center; text-decoration: none; }
    .bank-badge { background: #115e59; padding: 10px; border-radius: 8px; font-size: 13px; color: #ccfbf1; font-family: monospace; border: 1px dashed #14b8a6; margin-bottom: 12px; }
    .track-box { background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; color: #38bdf8; }
    
    /* ====== THEME B: COMPANY (STEEL BLUE) ====== */
    .theme-company { background: #0f172a !important; }
    .company-panel { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .vault-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid #38bdf8; padding: 18px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
    .vault-card h2 { font-size: 32px; color: #38bdf8; margin: 0; font-weight: 800; }
    .card-company { background: #1e293b; border: 1px solid #334155; padding: 16px; border-radius: 14px; margin-bottom: 12px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .input-row div { flex: 1; }
  </style>
</head>
<body>

  <!-- AUTH VIEW -->
  <div id="auth-view" class="screen active-view">
    <div class="login-container">
      <h1 style="color:var(--accent); font-weight:900; margin:0 0 5px 0;">🍊 FlashFood</h1>
      <p style="color:var(--text-muted); font-size:13px; margin:0 0 25px 0;">Anti-Scam P2P Food Trading Engine</p>
      <div class="form-group">
        <label>SELECT PORTAL ACCESS MODE</label>
        <select id="user-role-select">
          <option value="buyer">Hungry Buyer Feed</option>
          <option value="company">Restaurant Owner Portal (Company)</option>
        </select>
      </div>
      <div class="form-group">
        <label>ACCOUNT PROFILE NAME</label>
        <input type="text" id="user-name-input" placeholder="e.g. Iya Basira, David">
      </div>
      <button class="btn" onclick="processPortalRouting()">Connect Securely</button>
      <button class="clear-btn" onclick="wipeLocalSystemDB()">Wipe Storage Cache</button>
    </div>
  </div>

  <!-- BUYER SCREEN -->
  <div id="buyer-view" class="screen">
    <div class="buyer-panel">
      <span>Buyer Session: <strong id="b-tag" style="color:#22c55e;"></strong></span>
      <button style="background:rgba(239,68,68,0.15); color:#f87171; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="exitToGateway()">Logout</button>
    </div>
    <h3 style="color:#22c55e; margin:0 0 15px 0;">Verified Live Surplus Feeds</h3>
    <div id="buyer-render-deck"></div>
  </div>

  <!-- COMPANY SCREEN -->
  <div id="company-view" class="screen">
    <div class="company-panel">
      <span>Merchant Node: <strong id="c-tag" style="color:#38bdf8;"></strong></span>
      <button style="background:rgba(239,68,68,0.15); color:#f87171; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="exitToGateway()">Logout</button>
    </div>
    <div class="vault-card">
      <p style="font-size:10px; font-weight:700; color:var(--text-muted); margin:0 0 4px 0; letter-spacing:1px;">TOTAL SYSTEM NET PROFITS</p>
      <h2 id="merchant-balance-label">$0.00</h2>
    </div>
    <div class="card-company" style="border: 1px solid #38bdf8; margin-bottom: 20px;">
      <h4 style="margin:0 0 10px 0; color:#38bdf8;">Order Dispatch Terminal</h4>
      <div class="form-group">
        <label>ENTER BUYER'S SECURE COLLECTION PIN</label>
        <input type="number" id="merchant-pin-entry" placeholder="e.g. 8421">
      </div>
      <button class="btn" style="background:#38bdf8; color:#0f172a;" onclick="verifySecurePayoutTicket()">Validate PIN</button>
    </div>
    <div class="card-company" style="border: 1px dashed var(--accent);">
      <h4 style="margin:0 0 12px 0; color:#fff;">Broadcast Excess Inventory Stream</h4>
      <div class="form-group">
        <label>SURPLUS PACK DESCRIPTION</label>
        <input type="text" id="p-food-name" placeholder="e.g. Jollof Rice Combo">
      </div>
      <div class="input-row">
        <div><label>RETAIL PRICE ($)</label><input type="number" id="p-food-price" placeholder="10.00"></div>
        <div><label>WHATSAPP NUMBER</label><input type="text" id="p-company-phone" placeholder="23480000000"></div>
      </div>
      <div class="input-row">
        <div><label>BANK ACCOUNT NUMBER</label><input type="text" id="p-bank-acc" placeholder="1023456789"></div>
        <div><label>BANK NAME</label><input type="text" id="p-bank-name" placeholder="GTBank"></div>
      </div>
      <button class="btn" style="background:var(--success);" onclick="publishMerchantSurplusStream()">Publish Flash Live</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
