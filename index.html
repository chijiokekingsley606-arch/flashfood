<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashfood PH</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto,sans-serif}
body{margin:0;background:#f5f7f5;display:flex;justify-content:center;min-height:100vh}
.card{width:100%;max-width:400px;background:white;margin:20px;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.tabs{display:flex;background:#f0f0f0;border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;padding:10px;border-radius:999px;background:transparent;font-weight:600;cursor:pointer}
.tabs button.active{background:white;box-shadow:0 2px 8px rgba(0,0,0,.1)}
label{font-size:12px;color:#333;margin:8px 0 4px;display:block}
input,select{width:100%;padding:14px;border:1px solid #e5e5e5;border-radius:12px;outline:none;font-size:14px}
.btn{width:100%;margin-top:16px;padding:14px;border:0;background:#22c55e;color:white;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.msg{margin-top:12px;padding:10px;border-radius:10px;font-size:13px;display:none}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
.msg.ok{background:#dcfce7;color:#166534;display:block}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:0">Flashfood</h2>
<h1>Flashfood PH</h1>
<div class="tabs">
<button id="tabLogin" class="active" onclick="switchTab('login')">Login</button>
<button id="tabSignup" onclick="switchTab('signup')">Signup</button>
</div>

<div id="loginForm">
<label>Role</label><select id="loginRole"><option value="buyer">Buyer</option><option value="seller">Seller</option></select>
<label>Email</label><input id="loginEmail" type="email" placeholder="Email">
<label>Password</label><input id="loginPass" type="password" placeholder="Password">
<button class="btn" id="btnLogin" onclick="doLogin()">Login</button>
</div>

<div id="signupForm" style="display:none">
<label>Role</label><select id="role"><option value="seller">Seller</option><option value="buyer">Buyer</option></select>
<label>Full Name</label><input id="name" placeholder="Chijioke Kingsley Chiziterem">
<label>Email</label><input id="email" type="email" placeholder="your@email.com">
<label>Phone / WhatsApp</label><input id="phone" placeholder="09161071776">
<label>Bank Name</label><input id="bank" placeholder="Opay / Palmpay">
<label>Account Number</label><input id="acct" placeholder="Account number">
<label>Account Name</label><input id="acctName" placeholder="Account name">
<label>Password</label><input id="password" type="password" placeholder="Min 6 chars">
<button class="btn" id="btnSignup" onclick="doSignup()">Create Account</button>
</div>

<div id="msg" class="msg"></div>
</div>

<script>
const SUPABASE_URL = 'https://jklzrtpbdhmyqzqjhmwj.supabase.co';
const SUPABASE_KEY = 'PASTE_YOUR_FULL_sb_publishable_KEY_HERE';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showMsg(t, type){
  const m=document.getElementById('msg');
  m.textContent=t;
  m.className='msg '+(type==='err'?'err':'ok');
  m.style.display='block';
}
function switchTab(t){
  document.getElementById('loginForm').style.display = t==='login'?'block':'none';
  document.getElementById('signupForm').style.display = t==='signup'?'block':'none';
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabSignup').classList.toggle('active', t==='signup');
}
async function doSignup(){
  const btn=document.getElementById('btnSignup');
  btn.disabled=true; btn.textContent='Creating...';
  try{
    const role=document.getElementById('role').value;
    const name=document.getElementById('name').value.trim();
    const email=document.getElementById('email').value.trim();
    const phone=document.getElementById('phone').value.trim();
    const bank=document.getElementById('bank').value.trim();
    const acct=document.getElementById('acct').value.trim();
    const acctName=document.getElementById('acctName').value.trim();
    const password=document.getElementById('password').value;
    if(!email || !password) throw new Error('Email and password required');
    const { data, error } = await supabaseClient.auth.signUp({
      email,password,options:{data:{full_name:name,role,phone,bank_name:bank,account_number:acct,account_name:acctName}}
    });
    if(error) throw error;
    showMsg('Account created! Now click Login tab', 'ok');
    setTimeout(()=>{switchTab('login'); document.getElementById('loginEmail').value=email;},1500);
  }catch(e){ showMsg('Signup failed: '+(e.message||e), 'err'); }
  finally{ btn.disabled=false; btn.textContent='Create Account'; }
}
async function doLogin(){
  const btn=document.getElementById('btnLogin');
  btn.disabled=true; btn.textContent='Logging in...';
  try{
    const email=document.getElementById('loginEmail').value.trim();
    const password=document.getElementById('loginPass').value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({email,password});
    if(error) throw error;
    showMsg('Login success! Welcome '+email, 'ok');
  }catch(e){ showMsg('Login failed: '+(e.message||e), 'err'); }
  finally{ btn.disabled=false; btn.textContent='Login'; }
}
</script>
</body>
</html>
